const counts=()=>({review:tickets.filter(t=>['待确认','待复核','待人工'].includes(t.status)).length,done:tickets.filter(t=>t.status==='已分流').length,human:tickets.filter(t=>['待复核','待人工'].includes(t.status)).length,cache:tickets.filter(t=>t.status==='已暂存').length});
function reset(){clearTimeout(timer);busy=false;tickets=structuredClone(seeds);selected=tickets[0].id;view='tickets';filter='全部工单';query='';logs=[{time:'10:42:03',text:'登录异常工单完成分类',detail:'置信度 96% · 等待客服确认'},{time:'10:38:01',text:'VIP 工单进入人工复核',detail:'优先级 P1 · 已启用客户等级保护'},{time:'10:19:02',text:'下游写入失败，工单已暂存',detail:'等待模拟恢复后同步'}];render()}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),3000)}
function log(text,detail=''){logs.unshift({time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),text,detail})}
function badge(s){let c=['已分流'].includes(s)?'green':['待确认'].includes(s)?'blue':['待复核','待人工','已暂存'].includes(s)?'orange':'';return `<span class="badge ${c}">${esc(s)}</span>`}
function priority(p){return `<span class="badge ${p==='P1'?'red':p==='P2'?'orange':p==='P3'?'green':''}">${esc(p)}${p==='P1'?' 高':p==='P2'?' 中':p==='P3'?' 低':''}</span>`}
function stat(label,num,note,icon=''){return `<div class="stat"><span class="stat-label">${label}</span><span class="stat-icon">${icon}</span><strong>${num}</strong><p>${note}</p></div>`}
function render(){let c=counts();const labels={tickets:['工单中心','让每一张工单，进入正确的处理队列。'],analytics:['运营看板','观察分类效果与人工兜底情况。'],rules:['分流规则','明确自动处理边界，保留人工复核。'],logs:['运行日志','查看本次演示中的分类与流转记录。']};$('#page-title').textContent=labels[view][0];$('#crumb').textContent=labels[view][0];$('#page-subtitle').textContent=labels[view][1];$('#nav-count').textContent=tickets.length;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
if(view==='tickets'){$('#content').innerHTML=`<section class="stats">${stat('待确认 / 复核',c.review,`其中 VIP 工单 <em>${tickets.filter(t=>t.vip&&t.status==='待复核').length}</em> 条`,'▤')}${stat('已完成分流',c.done,'已进入对应处理队列','↗')}${stat('需要人工',c.human,'VIP 复核与低置信工单','♧')}${stat('故障暂存',c.cache,c.cache?'等待系统恢复后同步':'所有工单已同步','▱')}</section><section class="scenario-strip"><div class="scenario-label"><b>演示场景</b><small>点击切换预设工单</small></div><div class="scenario-buttons">${scenarios.map(([s,l,n])=>`<button class="scenario ${tickets.find(t=>t.id===selected)?.type===s?'selected':''}" data-scenario="${s}"><i>${n}</i>${l}</button>`).join('')}</div></section><div class="work-grid"><section class="panel"><div class="panel-title"><h2>工单队列 <small>共 ${tickets.length} 条</small></h2><span>按最新提交排序</span></div><div class="filters">${['全部工单','待处理','人工队列','已分流'].map(x=>`<button data-filter="${x}" class="${filter===x?'active':''}">${x}</button>`).join('')}</div><div class="search-wrap"><span>⌕</span><input id="search" aria-label="搜索工单" placeholder="搜索问题或工单编号" value="${esc(query)}"></div><div class="table-wrap"><table><thead><tr><th>工单 / 问题</th><th>分类</th><th>优先级</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div><div class="table-bottom"><span id="row-count"></span><span>示例数据 · 今天</span></div></section><section class="panel" id="detail"></section></div>`;renderRows();renderDetail();$('#search').addEventListener('input',e=>{query=e.target.value;renderRows()});}
if(view==='analytics')renderAnalytics();if(view==='rules')renderRules();if(view==='logs')$('#content').innerHTML=`<section class="panel wide-panel"><h2>流转记录 <span class="badge">本次演示</span></h2>${logs.map(l=>`<div class="log-row"><time>${esc(l.time)}</time><div>${esc(l.text)}<br><small>${esc(l.detail)}</small></div></div>`).join('')}</section>`;
}
function visible(){return tickets.filter(t=>(filter==='全部工单'||filter==='待处理'&&t.status!=='已分流'||filter==='人工队列'&&['待复核','待人工'].includes(t.status)||filter==='已分流'&&t.status==='已分流')&&(t.title+t.id+t.text).toLowerCase().includes(query.toLowerCase()))}
function renderRows(){const ts=visible();$('#rows').innerHTML=ts.length?ts.map(t=>`<tr class="${selected===t.id?'selected':''}" data-ticket="${t.id}" tabindex="0" aria-label="查看${esc(t.title)}"><td><span class="ticket-title">${t.vip?'<span class="vip">VIP</span>':''}${esc(t.title)}</span><span class="ticket-id">${t.id} · ${t.time}</span></td><td>${esc(t.cat)}</td><td>${priority(t.priority)}</td><td>${badge(t.status)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">没有符合条件的工单</td></tr>';$('#row-count').textContent=`显示 ${ts.length} 条工单`}
function renderDetail(){let t=tickets.find(t=>t.id===selected);if(!t)return;let manual=['待复核','待人工'].includes(t.status),invalid=t.status==='待补充',cache=t.status==='已暂存',done=t.status==='已分流';let path=categories[t.cat];let notice=invalid?['orange','请补充有效的问题描述','建议填写：遇到的问题、操作步骤和期望结果。例如：“登录工作台后一直白屏，刷新后仍无法使用。”']:cache?['red','系统繁忙，工单已暂存','本次演示暂存在页面内存；点击模拟恢复，将同步进入处理队列。']:t.status==='待复核'?['orange','VIP 保护 · 必须人工复核','系统预分类仅供参考。请人工确认分类，优先级固定为 P1，不允许降级。']:t.status==='待人工'?['orange','当前工单需人工处理',t.type==='low'?'置信度低于演示阈值 85%，不自动采用分类结果。请补充判断后确认分流。':'已转入人工队列，请确认分类与优先级。']:done?['','已进入处理队列',`处理队列：${esc(t.cat)}支持 · 最终优先级 ${esc(t.priority)}`]:['','分类建议已就绪','请确认分类与优先级，或转人工进一步处理。'];
$('#detail').innerHTML=`<div class="panel-title"><h2>工单详情</h2>${badge(t.status)}</div><div class="detail-body"><div class="detail-meta"><span class="ticket-id">${t.id}</span>${t.vip?'<span class="vip">VIP 客户</span>':'<span>普通客户</span>'}</div><h3>${esc(t.title)}</h3><div class="issue">${esc(t.text)}</div><div class="customer-info">${esc(t.customer)} · ${esc(t.company)} <span style="float:right">${t.time} 提交</span></div><div class="divider"></div><div class="section-label"><span class="ai-label">✧ ${done?'最终分流结果':'智能分类建议'}</span>${priority(t.priority)}</div>${path?`<div class="class-result">${path.map(esc).join('<span> / </span>')}</div>`:`<div class="class-result">${invalid?'内容无效，暂不分类':'待人工判断 · 未采用自动分类'}</div>`}${!invalid?`<div class="confidence"><span>分类置信度${manual?' · 仅供复核参考':''}</span><b>${t.confidence}%</b></div><div class="track"><i style="width:${t.confidence}%;${t.confidence<85?'background:#c3a15b':''}"></i></div>`:''}<div class="reason">${esc(t.reason)}</div><div class="notice ${notice[0]}"><b>${notice[1]}</b>${notice[2]}</div>${manual?`<div class="edit-grid"><label>人工确认分类<select id="manual-cat"><option value="">请选择分类</option>${Object.keys(categories).map(x=>`<option ${t.cat===x?'selected':''}>${x}</option>`).join('')}</select></label><label>优先级<select id="manual-priority" ${t.vip?'disabled':''}>${['P1','P2','P3'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></label></div>`:''}<div class="flow"><span>● 接收工单</span><i></i><span>● 智能识别</span><i></i><span>${done?'● 已分流':cache?'◌ 暂存等待':invalid?'◌ 待补充':manual?'◌ 人工复核':'◌ 确认入队'}</span></div></div><div class="detail-actions">${busy?'<button disabled>正在识别并检查分流规则…</button>':done?'<button data-action="replay">↻ 重新演示此工单</button>':invalid?'<button class="primary" data-action="supplement">补充问题并重试</button>':cache?'<button data-action="human">紧急转人工</button><button class="primary" data-action="recover">模拟恢复并同步</button>':manual?'<button data-action="replay">重新演示</button><button class="primary" data-action="confirm">确认复核并分流</button>':'<button data-action="human">转人工</button><button class="primary" data-action="confirm">确认分流</button>'}</div>`;
}
function renderAnalytics(){const c=counts();$('#content').innerHTML=`<section class="stats">${stat('本次演示工单',tickets.length,'当前队列实时统计')}${stat('已分流比例',`${Math.round(c.done/tickets.length*100)}<small>%</small>`,`${c.done} 条已分流 / ${tickets.length} 条总工单`)}${stat('待人工比例',`${Math.round(c.human/tickets.length*100)}<small>%</small>`,`${c.human} 条待人工 / ${tickets.length} 条总工单`)}${stat('普通工单抽检准确率','91.5<small>%</small>','固定演示值 · 183 / 200 条正确')}</section><div class="rules-grid"><section class="panel wide-panel"><h2>当前工单分类分布</h2>${[...Object.keys(categories),'待人工判断','未分类'].map(cat=>{const n=tickets.filter(t=>t.cat===cat).length;return `<div class="bar-row"><span>${cat}</span><div class="track"><i style="width:${n/tickets.length*100}%"></i></div><span>${n} 条</span></div>`}).join('')}</section><section class="panel wide-panel"><h2>POC 验收参考</h2><div class="notice"><b>普通工单分类准确率 ≥ 85%</b>示例评测集：200 条，分类正确 183 条，准确率 91.5%。此处为预设展示数据，不代表实际模型效果。</div><div class="notice orange"><b>VIP 工单 100% 人工复核</b>所有 VIP 示例均进入复核队列，未经人工确认不可自动分流。</div><p class="muted">分类置信度是单张工单的模拟判断分数；抽检准确率是评测集的整体正确比例，两者含义不同。</p></section></div>`}
function renderRules(){$('#content').innerHTML=`<div class="rules-grid"><section class="panel rule-card"><h2>普通工单自动分类</h2><strong>85% <span style="font-size:14px;font-weight:400">演示置信度阈值</span></strong><p>识别问题类型、三级分类标签与优先级，确认后进入对应处理队列。</p><ul><li>P1 高：影响正常使用或涉及支付异常</li><li>P2 中：部分功能受阻</li><li>P3 低：常规咨询与操作指引</li></ul></section><section class="panel rule-card"><h2>VIP 客户保护</h2><strong>强制人工复核</strong><p>无论分类置信度高低，VIP 工单均进入人工复核队列。</p><ul><li>AI 结果仅作为预分类建议</li><li>本演示 VIP 优先级锁定为 P1</li><li>人工确认后才能完成分流</li></ul></section><section class="panel rule-card"><h2>无法可靠分类</h2><ul><li>无效输入：提示补充问题，提供填写示例</li><li>置信度不足：携带问题上下文转人工</li><li>人工修正：记录最终分类和复核操作</li></ul></section><section class="panel rule-card"><h2>下游故障兜底</h2><ul><li>写入失败：工单进入暂存状态</li><li>模拟恢复：同步到正式处理队列</li><li>紧急诉求：可直接转入人工队列</li></ul><p>演示数据仅在当前页面内存中保存，刷新或重置后恢复预设。</p></section></div>`}
function openDialog(t){$('#ticket-form').reset();$('#ticket-text').value=t?.text||'';$('#customer-tier').value=t?.vip?'vip':'normal';$('#ticket-dialog').dataset.source=t?.id||'';$('#ticket-dialog').showModal()}
function action(a){if(busy)return;let t=tickets.find(t=>t.id===selected);if(a==='supplement'){openDialog(t);return}if(a==='replay'){let original=seeds.find(x=>x.id===t.id);busy=true;renderDetail();timer=setTimeout(()=>{if(original)Object.assign(t,structuredClone(original));else t.status=t.vip?'待复核':t.type==='low'?'待人工':t.type==='invalid'?'待补充':t.type==='failure'?'已暂存':'待确认';busy=false;log('重新运行分类演示',t.id);render();toast('已重新演示，分流结果已更新')},700);return}if(a==='human'){t.status=t.vip?'待复核':'待人工';log('工单转入人工队列',t.id+' · 保留完整问题上下文');toast('已转人工，上下文已保留')}if(a==='recover'){t.status=t.vip?'待复核':t.type==='low'?'待人工':'已分流';log('模拟系统恢复，暂存工单已同步',t.id+' · 未重复创建工单');toast(t.vip?'已同步，等待 VIP 人工复核':'系统已恢复，工单已同步')}if(a==='confirm'){if(['待复核','待人工'].includes(t.status)){const cat=$('#manual-cat').value;if(!cat){toast('请先选择人工确认的分类');return}t.cat=cat;t.priority=t.vip?'P1':$('#manual-priority').value;t.reason='客服已人工确认分类与优先级；复核结果已记录。'}t.status='已分流';log('工单已确认分流',t.id+' · '+t.cat+' · '+t.priority);toast('已分流至'+t.cat+'处理队列')}render()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;render()}const scenario=e.target.closest('[data-scenario]');if(scenario){selected=seeds.find(t=>t.type===scenario.dataset.scenario).id;filter='全部工单';query='';render()}const row=e.target.closest('[data-ticket]');if(row){selected=row.dataset.ticket;renderRows();renderDetail();document.querySelectorAll('[data-scenario]').forEach(b=>b.classList.toggle('selected',b.dataset.scenario===tickets.find(t=>t.id===selected).type))}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render()}const a=e.target.closest('[data-action]');if(a)action(a.dataset.action)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-ticket]')){e.preventDefault();e.target.click()}});
$('#reset').onclick=()=>{reset();toast('演示已重置，所有预设工单已恢复')};$('#new-ticket').onclick=()=>openDialog();$('#close-dialog').onclick=$('#cancel-dialog').onclick=()=>$('#ticket-dialog').close();
$('#ticket-form').onsubmit=e=>{e.preventDefault();let raw=$('#ticket-text').value.trim();if(!raw){toast('请填写问题描述');return}let text=raw.replace(/1[3-9]\d{9}/g,s=>s.slice(0,3)+'****'+s.slice(-4)).replace(/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/g,'***@***');let vip=$('#customer-tier').value==='vip',failure=$('#simulate-failure').checked,invalid=text.replace(/[^\u4e00-\u9fa5a-zA-Z]/g,'').length<6||!/[\u4e00-\u9fa5]/.test(text);let cat=/登录|白屏|密码|加载/.test(text)?'账号登录':/支付|扣款|退款|账单|续费/.test(text)?'支付问题':/权限|成员|同事/.test(text)?'账号设置':/报表|导出|功能|统计/.test(text)?'功能使用':'待人工判断';let low=cat==='待人工判断',type=invalid?'invalid':failure?'failure':vip?'vip':low?'low':'normal';let t={id:'T20260917'+String(19+tickets.length-seeds.length).padStart(3,'0'),title:text.length>22?text.slice(0,22)+'…':text,text,customer:'演示客户',company:'新建示例',vip,type,cat:invalid?'未分类':cat,priority:vip?'P1':invalid?'—':low?'待定':cat==='支付问题'||cat==='账号登录'?'P1':cat==='功能使用'?'P2':'P3',confidence:invalid?0:low?52:96,status:invalid?'待补充':failure?'已暂存':vip?'待复核':low?'待人工':'待确认',time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}),reason:invalid?'未识别到完整的业务诉求。':low?'未匹配明确业务意图，请由人工判断。':'按本地关键词规则生成分类建议，仅用于交互演示。'};let source=$('#ticket-dialog').dataset.source;if(source){let i=tickets.findIndex(x=>x.id===source);t.id=source;tickets[i]=t}else tickets.unshift(t);selected=t.id;view='tickets';filter='全部工单';query='';log(source?'补充问题后重新识别':'接收新建演示工单',t.id+' · '+t.status);$('#ticket-dialog').close();render();toast('已完成模拟识别：'+t.status)};
reset();
</script></body></html>
